name: TWSE Daily Stock Pipeline

on:
  schedule:
    # UTC 07:30 = 台灣時間 (UTC+8) 15:30，週一至週五執行
    - cron: "30 7 * * 1-5"
  # 允許在 GitHub 網頁介面上隨時手動觸發測試
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TWSE data pipeline
        run: |
          PYTHONPATH=src python src/pipeline.py

      - name: Commit and push updated SQLite database
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/twse_stocks.db
          if git diff --staged --quiet; then
            echo "資料庫無變更（可能為假日休市），略過 Commit。"
          else
            git commit -m "chore(data): update TWSE daily metrics ($(TZ='Asia/Taipei' date +'%Y-%m-%d'))"
            git push
          fi